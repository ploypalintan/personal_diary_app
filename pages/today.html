<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>today · my diary</title>
  <link rel="stylesheet" href="../style.css" />
  <style>
    .todo-card.done-card .tname {
      text-decoration: line-through;
      color: var(--text-muted);
    }
    .todo-card.done-card { opacity: 1; background: var(--almond-pale); }
  
    .daybar { display: flex; align-items: center; justify-content: center; gap: 14px; margin: 4px 0 6px; }
    .day-head { text-align: center; min-width: 0; flex: 0 1 420px; }
    .day-name { font-family: var(--font-script); font-size: clamp(2.8rem, 5vw, 3.6rem); line-height: 1.05; color: var(--ink); }
    .day-date { font-family: var(--font-caps); text-transform: uppercase; letter-spacing: .12em; font-size: 1rem; white-space: nowrap; color: var(--ink-soft); }
    .day-tag { display: inline-block; margin-top: 6px; padding: 2px 14px; border-radius: 16px; font-size: .88rem; font-weight: 600; background: var(--accent-pink); color: var(--mauve-deep); }
    .day-tag.now { background: #B35878; color: #fff; }
    .day-arrow { flex: none; width: 52px; height: 52px; border-radius: 50%; border: 1.5px solid var(--border-strong); background: var(--card); color: var(--mauve-dark); font-size: 1.9rem; line-height: 1; cursor: pointer; transition: transform .2s, background .2s, color .2s, box-shadow .2s; }
    .day-arrow:hover, .day-arrow:focus-visible { background: var(--mauve); color: #fff; transform: scale(1.1); box-shadow: 0 4px 12px rgba(110,50,70,.25); }
    .day-arrow:first-child:hover { transform: scale(1.1) translateX(-3px); }
    .day-arrow:last-child:hover { transform: scale(1.1) translateX(3px); }
    .link-btn { background: var(--card); border: 1px solid var(--border-strong); border-radius: 18px; padding: 6px 14px; font: 500 .92rem var(--font); color: var(--mauve-dark); cursor: pointer; min-height: 40px; }
    .link-btn:hover { background: var(--almond-light); }
    .day-tools { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; margin: 6px 0 10px; position: relative; }
    .native-date { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
    .archive { margin-top: 26px; }
    .archive summary { cursor: pointer; font-family: var(--font-caps); text-transform: uppercase; letter-spacing: .16em; font-size: .9rem; color: var(--ink-soft); min-height: 40px; display: flex; align-items: center; }
    .arch-item { display: block; width: 100%; margin-bottom: 8px; }
    .arch-item { text-align: left; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--border); background: var(--card); cursor: pointer; font: 500 .95rem var(--font); color: var(--ink); min-height: 48px; }
    .arch-item:hover { background: var(--almond-light); }
    .arch-item[aria-current="date"] { border-color: var(--mauve); box-shadow: inset 4px 0 0 #B35878; }
    .arch-item small { display: block; color: var(--text-muted); font-size: .85rem; }
    @media (max-width: 520px) { .day-arrow { width: 44px; height: 44px; font-size: 1.5rem; } .daybar { gap: 8px; } }
  </style>
</head>
<body class="today-page">
<div id="mainApp" class="active fade-open">

  <!-- SPINE -->
  <div class="spine"><div class="spine-text">my diary</div></div>

  <!-- BOOKMARKS -->
  <nav class="bookmarks">
    <a class="bm" data-page="today.html">
      <span class="bm-icon">✦</span>today
    </a>
    <a class="bm" data-page="tracker.html">
      <span class="bm-icon">✧</span>makeup
    </a>
    <a class="bm" data-page="mood.html">
      <span class="bm-icon">◌</span>mood
    </a>
    <a class="bm" data-page="finance.html">
      <span class="bm-icon">◇</span>finance
    </a>
    <a class="bm" data-page="../index.html"><span class="bm-icon">❀</span>cover</a>
  </nav>

  <!-- PAGE -->
  <main class="page">
    <section class="pg pg-left" aria-label="left page">
      <div class="page-header">
        <div class="page-title">daily checklist</div>
        <div class="page-date js-today"></div>
      </div>
      <div class="pg-body">
        <div class="daybar">
          <button class="day-arrow" id="prevDay" type="button" aria-label="previous day" title="earlier day">‹</button>
          <div class="day-head" role="group" aria-label="viewing day">
            <div class="day-name" id="dayName"></div>
            <div class="day-date" id="dayDate"></div>
            <span class="day-tag" id="dayTag"></span>
          </div>
          <button class="day-arrow" id="nextDay" type="button" aria-label="next day" title="later day">›</button>
        </div>
        <div class="day-tools">
          <button class="link-btn" id="todayBtn" type="button">jump to today</button>
          <button class="link-btn" id="pickBtn" type="button">📅 pick a date</button>
          <input class="native-date" type="date" id="datePick" tabindex="-1" aria-hidden="true" />
          <button class="link-btn" id="archiveBtn" type="button" aria-pressed="false">all days</button>
          <button class="link-btn" id="carryBtn" type="button" hidden></button>
        </div>
        <div class="prog-wrap"><div class="prog-fill" id="progressFill" style="width:0%"></div></div>
        <div class="add-stack">
          <input class="r-input" id="taskInput" placeholder="add a task to your day…" />
          <div class="add-opts">
            <select class="r-select" id="taskCat" aria-label="category">
              <option value="work">work</option><option value="self care">self care</option><option value="home">home</option><option value="social">social</option><option value="creative">creative</option>
            </select>
            <select class="r-select" id="taskPrio" aria-label="priority">
              <option value="hi">high</option><option value="me">medium</option><option value="lo">low</option>
            </select>
            <button class="mic-btn" id="micBtn" type="button" aria-pressed="false" aria-label="speak a task"><span class="mic-icon" aria-hidden="true">🎙</span><span class="mic-label">speak</span></button>
            <button class="btn-small" onclick="addTask()">+ add</button>
          </div>
        </div>
        <div class="mic-status" id="micStatus" role="status" aria-live="polite"></div>
      </div>
    </section>
    <section class="pg pg-right room-bg" aria-label="right page">
      <div class="pg-body">
        <div class="sec-label" id="rightTitle">tasks</div>
        <div class="pg-grow" id="todoList"></div>
        <div class="pg-grow" id="archiveList" hidden></div>
      </div>
    </section>
  </main>

</div>

<script src="../data/diaryData.js"></script>
<script src="../components/diaryCard.js"></script>
<script src="../components/stickers.js"></script>
<script src="../components/navbar.js"></script>
<script src="../components/pager.js"></script>
<script src="../components/voice.js"></script>
<script>
  let state = initPage();
  const $ = (id) => document.getElementById(id);
  const pad2 = (n) => String(n).padStart(2, '0');
  const isoOf = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
  const fromISO = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
  const shiftISO = (s, n) => { const d = fromISO(s); d.setDate(d.getDate() + n); return isoOf(d); };
  const validISO = (s) => /^\d{4}-\d{2}-\d{2}$/.test(s || '') && isoOf(fromISO(s)) === s;
  const todayISO = () => isoOf(new Date());
  const dayLabel = (s) => `${DAYS[fromISO(s).getDay()]}`;
  const dateLabel = (s) => { const d = fromISO(s); return `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`; };
  const dmy = (s) => { const d = fromISO(s); return `${pad2(d.getDate())}/${pad2(d.getMonth() + 1)}/${d.getFullYear()}`; };

  /* every task belongs to one day; older tasks without a date are filed under the day they are first seen */
  state.todos = state.todos || [];
  state.todos.forEach(t => { if (!validISO(t.date)) t.date = todayISO(); });

  let viewDate = validISO(location.hash.slice(1)) ? location.hash.slice(1) : todayISO();

  function setView(iso, push) {
    viewDate = iso; showArchive = false;
    if (push !== false) history.replaceState(null, '', iso === todayISO() ? location.pathname : '#' + iso);
    render();
  }

  /* ── render ── */
  function render() {
    const today = todayISO();
    const list = $('todoList'); list.innerHTML = '';
    const todos = state.todos.filter(t => t.date === viewDate);

    /* header: clear day + date */
    $('dayName').textContent = dayLabel(viewDate).toLowerCase();
    $('dayDate').textContent = dmy(viewDate) + ' · ' + dateLabel(viewDate);
    const tag = $('dayTag');
    const diff = Math.round((fromISO(viewDate) - fromISO(today)) / 86400000);
    tag.textContent = diff === 0 ? 'today' : diff === -1 ? 'yesterday' : diff === 1 ? 'tomorrow' : diff < 0 ? `${-diff} days ago · archived` : `in ${diff} days · planned`;
    tag.className = 'day-tag' + (diff === 0 ? ' now' : '');
    $('nextDay').title = 'later day'; $('prevDay').title = 'earlier day';
    $('todayBtn').hidden = diff === 0;
    setMemo(viewDate, diff);

    if (!todos.length) {
      list.innerHTML = diff < 0 ? '<div class="empty-state">nothing was written on this day.</div>' : '<div class="empty-state">nothing yet — what\'s calling you?</div>';
    } else todos.forEach(item => list.appendChild(makeTodoCard(item, toggleTask, deleteTask)));

    const done = todos.filter(t => t.done).length, total = todos.length;
    $('progressFill').style.width = total ? Math.round((done / total) * 100) + '%' : '0%';

    /* carry unfinished tasks of a past day to today */
    const open = todos.filter(t => !t.done).length;
    const carry = $('carryBtn');
    carry.hidden = !(diff < 0 && open);
    carry.textContent = `move ${open} unfinished to today`;

    renderArchive(today);
    $('rightTitle').textContent = showArchive ? 'all days' : `tasks · ${dmy(viewDate)}`;
    $('todoList').hidden = showArchive; $('archiveList').hidden = !showArchive;
    paginate(showArchive ? $('archiveList') : $('todoList'));
    saveState(state);
  }
  let showArchive = false;

  function renderArchive(today) {
    const byDay = {};
    state.todos.forEach(t => { (byDay[t.date] = byDay[t.date] || []).push(t); });
    const days = Object.keys(byDay).sort().reverse();
    $('archiveBtn').textContent = `all days (${days.length})`; $('archiveBtn').setAttribute('aria-pressed', String(showArchive));
    const box = $('archiveList'); box.innerHTML = '';
    if (!days.length) { box.textContent = 'days you write on will be listed here.'; return; }
    days.forEach(d => {
      const items = byDay[d], done = items.filter(t => t.done).length;
      const b = document.createElement('button'); b.type = 'button'; b.className = 'arch-item';
      if (d === viewDate) b.setAttribute('aria-current', 'date');
      const strong = document.createElement('span'); strong.textContent = `${dayLabel(d).slice(0, 3).toLowerCase()} ${dmy(d)}`;
      const small = document.createElement('small'); small.textContent = `${done} of ${items.length} done${d === today ? ' · today' : ''}`;
      b.append(strong, small);
      b.addEventListener('click', () => { showArchive = false; setView(d); });
      box.appendChild(b);
    });
  }

  /* memo header (built by navbar.js) shows the viewed day */
  function setMemo(iso, diff) {
    const cell = document.querySelector('.memo-cell.date');
    if (cell) { const d = fromISO(iso); cell.textContent = `${pad2(d.getDate())} / ${pad2(d.getMonth() + 1)}`; cell.setAttribute('aria-label', `${dayLabel(iso)} ${dateLabel(iso)}`); }
  }

  /* ── add ── */
  function addTask() {
    const v = $('taskInput').value.trim();
    if (!v) return;
    state.todos.unshift({ id: state.nextIds.todo++, name: v, cat: $('taskCat').value, prio: $('taskPrio').value, done: false, date: viewDate });
    $('taskInput').value = '';
    render();
  }
  $('taskInput').addEventListener('keydown', e => { if (e.key === 'Enter') addTask(); });

  function toggleTask(id) { const t = state.todos.find(x => x.id === id); if (t) t.done = !t.done; render(); }
  function deleteTask(id) { state.todos = state.todos.filter(x => x.id !== id); render(); }

  /* ── day navigation ── */
  $('archiveBtn').addEventListener('click', () => { showArchive = !showArchive; render(); });
  $('prevDay').addEventListener('click', () => setView(shiftISO(viewDate, -1)));
  $('nextDay').addEventListener('click', () => setView(shiftISO(viewDate, 1)));
  $('todayBtn').addEventListener('click', () => setView(todayISO()));
  $('pickBtn').addEventListener('click', () => { $('datePick').value = viewDate; try { $('datePick').showPicker(); } catch (e) { $('datePick').focus(); } });
  $('datePick').addEventListener('change', () => { if (validISO($('datePick').value)) setView($('datePick').value); });
  $('carryBtn').addEventListener('click', () => {
    const t0 = todayISO();
    state.todos.filter(t => t.date === viewDate && !t.done).forEach(t => { t.date = t0; });
    setView(t0);
  });
  window.addEventListener('hashchange', () => { viewDate = validISO(location.hash.slice(1)) ? location.hash.slice(1) : todayISO(); render(); });

  attachVoice({ button: $('micBtn'), status: $('micStatus'), target: $('taskInput'), append: false });
  render();
</script>
</body>
</html>
