<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>finance · my diary</title>
  <link rel="stylesheet" href="../style.css" />
  <style>
    .currency-row {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--almond-pale);
      border: 0.5px solid var(--border-soft);
      border-radius: 12px;
      padding: 10px 14px;
      margin-bottom: 16px;
    }
    .currency-label {
      font-size: 13px;
      color: var(--text-muted);
      letter-spacing: 0.06em;
      font-family: var(--font);
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 18px;
    }
    .summary-stat {
      background: var(--almond-pale);
      border-radius: 12px;
      padding: 12px;
      text-align: center;
      border: 0.5px solid var(--border-soft);
    }
    .summary-label {
      font-size: 13px;
      color:var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 4px;
      font-family: var(--font);
    }
    .summary-val {
      font-size: 17px;
      color: var(--ink);
      font-family: var(--font);
    }
    .summary-val.pos { color: var(--positive); }
    .summary-val.neg { color: var(--negative); }
    .summary-val.bal { color: var(--mauve); }

    .income-box {
      background: var(--almond-pale);
      border: 0.5px solid var(--border-soft);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 16px;
    }
    .income-box-title {
      font-size: 13px;
      color: var(--mauve);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 10px;
      font-family: var(--font);
    }
    .income-add-row {
      display: flex;
      gap: 6px;
      align-items: center;
      margin-top: 10px;
      flex-wrap: wrap;
    }

.view { display: flex; flex-direction: column; flex: 1 1 auto; min-height: 0; }
    .view[hidden] { display: none; }
    .seg { display: flex; gap: 6px; margin-bottom: 10px; }
    .seg-btn { flex: 1; min-height: 42px; border-radius: 20px; border: 1.5px solid var(--border-strong); background: var(--card); color: var(--mauve-dark); font: 600 .95rem var(--font); cursor: pointer; text-transform: lowercase; }
    .seg-btn[aria-pressed="true"] { background: var(--mauve); color: #fff; border-color: var(--mauve); }
    .brk-row { display: grid; grid-template-columns: 7.5em 1fr auto; gap: 10px; align-items: center; margin-bottom: 8px; font-size: .95rem; }
    .brk-bar { height: 10px; border-radius: 6px; background: rgba(154,74,99,.16); overflow: hidden; }
    .brk-bar i { display: block; height: 100%; background: var(--mauve); border-radius: 6px; }
    .divider { height: 0.5px; background: var(--border-soft); margin: 12px 0; }

    /* month navigator + MTD stats */
    .monthbar { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 2px 0 4px; }
    .month-head { text-align: center; min-width: 0; flex: 0 1 300px; }
    .month-name { font-family: var(--font-script); font-size: 56px; line-height: .95; color: var(--ink); }
    .month-sub { font-family: var(--font-caps); text-transform: uppercase; letter-spacing: .16em; font-size: 12px; color: var(--text-muted); margin-top: 2px; }
    .day-arrow { flex: none; width: 46px; height: 46px; border-radius: 50%; border: 1.5px solid var(--border-strong); background: var(--card); color: var(--mauve-dark); font-size: 1.7rem; line-height: 1; cursor: pointer; transition: transform .2s, background .2s, color .2s; }
    .day-arrow:hover, .day-arrow:focus-visible { background: var(--mauve); color: #fff; transform: scale(1.1); }
    .day-arrow:disabled { opacity: .35; cursor: default; transform: none; }
    .month-tools { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; margin: 6px 0 10px; }
    .link-btn { background: var(--card); border: 1px solid var(--border-strong); border-radius: 18px; padding: 6px 14px; font: 600 14px var(--font); color: var(--mauve-dark); cursor: pointer; min-height: 38px; }
    .link-btn[aria-pressed="true"] { background: var(--mauve); color: #fff; border-color: var(--mauve); }
    .month-tools .r-select { min-height: 38px; max-width: 130px; }
    .summary-grid { margin-bottom: 12px; }
    .summary-val { font-size: 22px !important; font-weight: 700; }
    .fin-meta { font-size: 12px; color: var(--text-muted); }
    .fin-name { font-size: 17px; font-weight: 600; color: var(--ink); }
    .fin-amt { font-size: 18px; font-weight: 700; white-space: nowrap; }
    .brk-row { font-size: 15px; } .brk-row span:first-child { font-weight: 600; text-transform: capitalize; } .brk-row span:last-child { font-weight: 700; }
    .pg-right .add-row { flex-wrap: wrap; } .pg-right .add-row .r-input { flex: 1 1 100% !important; } .pg-right .add-row .r-number { flex: 1 1 90px; min-width: 0; } .pg-right .add-row input[type=date] { flex: 1 1 150px; min-width: 150px; }
  </style>
</head>
<body>
<div id="mainApp" class="active fade-open">

  <div class="spine"><div class="spine-text">my diary</div></div>

  <nav class="bookmarks">
    <a class="bm" data-page="today.html"><span class="bm-icon">✦</span>today</a>
    <a class="bm" data-page="tracker.html"><span class="bm-icon">✧</span>makeup</a>
    <a class="bm" data-page="mood.html"><span class="bm-icon">◌</span>mood</a>
    <a class="bm" data-page="finance.html"><span class="bm-icon">◇</span>finance</a>
    <a class="bm" data-page="../index.html"><span class="bm-icon">❀</span>cover</a>
  </nav>

  <main class="page">
    <section class="pg pg-left" aria-label="left page">
      <div class="page-header">
        <div class="page-title">finance</div>
        <div class="page-date js-today"></div>
      </div>
      <div class="pg-body">
        <div class="monthbar">
          <button class="day-arrow" id="prevM" type="button" aria-label="previous month" title="earlier month">‹</button>
          <div class="month-head" role="group" aria-label="viewing month">
            <div class="month-name" id="monthName"></div>
            <div class="month-sub" id="monthSub"></div>
          </div>
          <button class="day-arrow" id="nextM" type="button" aria-label="next month" title="later month">›</button>
        </div>
        <div class="month-tools">
          <button class="link-btn" id="thisMonthBtn" type="button">this month</button>
          <button class="link-btn" id="allTimeBtn" type="button" aria-pressed="false">all time</button>
          <select class="r-select" id="currencySelect" aria-label="currency" onchange="onCurrencyChange()">
            <option value="SGD">🇸🇬 SGD S$</option><option value="USD">🇺🇸 USD $</option><option value="GBP">🇬🇧 GBP £</option><option value="EUR">🇪🇺 EUR €</option>
            <option value="JPY">🇯🇵 JPY ¥</option><option value="AUD">🇦🇺 AUD A$</option><option value="CAD">🇨🇦 CAD C$</option><option value="THB">🇹🇭 THB ฿</option>
            <option value="MYR">🇲🇾 MYR RM</option><option value="IDR">🇮🇩 IDR Rp</option><option value="HKD">🇭🇰 HKD HK$</option><option value="KRW">🇰🇷 KRW ₩</option>
            <option value="INR">🇮🇳 INR ₹</option><option value="CNY">🇨🇳 CNY ¥</option><option value="AED">🇦🇪 AED د.إ</option>
          </select>
        </div>
        <div class="summary-grid">
          <div class="summary-stat"><div class="summary-label" id="lblIncome">MTD income</div><div class="summary-val pos" id="statIncome"></div></div>
          <div class="summary-stat"><div class="summary-label" id="lblSpent">MTD spend</div><div class="summary-val neg" id="statSpent"></div></div>
          <div class="summary-stat"><div class="summary-label" id="lblBal">MTD balance</div><div class="summary-val bal" id="statBalance"></div></div>
        </div>
        <div class="sec-label" id="wentLabel">where it went</div>
        <div class="pg-grow" id="catBreakdown"></div>
      </div>
    </section>
    <section class="pg pg-right" aria-label="right page">
      <div class="pg-body">
        <div class="seg" role="group" aria-label="finance view">
          <button class="seg-btn" id="segExp" type="button" aria-pressed="true">expenses</button>
          <button class="seg-btn" id="segInc" type="button" aria-pressed="false">income</button>
        </div>

        <div id="viewExp" class="view">
          <div class="add-row">
            <input class="r-input" id="expDesc" aria-label="what did you spend on" placeholder="what did you spend on…" style="flex:1;min-width:70px" />
            <input type="number" class="r-number" id="expAmt" aria-label="amount" placeholder="amount" step="0.01" min="0" />
            <select class="r-select" id="expCat" aria-label="expense category">
              <option value="food">food</option><option value="beauty">beauty</option><option value="fashion">fashion</option><option value="transport">transport</option>
              <option value="home">home</option><option value="health">health</option><option value="fun">fun</option><option value="other">other</option>
            </select>
            <input type="date" class="r-number" id="expDate" aria-label="date of expense" />
            <button class="btn-small" onclick="addExpense()">+ log</button>
          </div>
          <div class="pg-grow" id="expList"></div>
        </div>

        <div id="viewInc" class="view" hidden>
          <div class="add-row">
            <input class="r-input" id="incomeDesc" aria-label="income source" placeholder="income source…" style="flex:1;min-width:80px" />
            <input type="number" class="r-number" id="incomeAmt" aria-label="amount" placeholder="amount" step="0.01" min="0" />
            <select class="r-select" id="incomeType" aria-label="income type">
              <option value="salary">salary</option><option value="socials">socials</option><option value="freelance">freelance</option><option value="passive">passive</option>
              <option value="investment">investment</option><option value="gift">gift</option><option value="other">other</option>
            </select>
            <input type="date" class="r-number" id="incomeDate" aria-label="date of income" />
            <button class="btn-small" onclick="addIncome()">+ add</button>
          </div>
          <div class="pg-grow" id="incomeList"></div>
        </div>
      </div>
    </section>
  </main>
</div>

<script src="../data/diaryData.js"></script>
<script src="../components/expiry.js"></script>
<script src="../components/diaryCard.js"></script>
<script src="../components/stickers.js"></script>
<script src="../components/navbar.js"></script>
<script src="../components/pager.js"></script>
<script>
  let state = initPage();

  /* set saved currency on select */
  const currSel = document.getElementById('currencySelect');
  currSel.value = state.currency || 'SGD';
  window._currSym = CURRENCIES[currSel.value] || 'S$';

  function onCurrencyChange() {
    state.currency = currSel.value;
    window._currSym = CURRENCIES[state.currency] || '$';
    saveState(state);
    render();
  }

  function fmt(v) {
    return window._currSym + Math.abs(v).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  /* ── month navigation: which month are we looking at? ('all' = everything) ── */
  const MONTH_LC = ['january','february','march','april','may','june','july','august','september','october','november','december'];
  const thisMonthKey = () => todayISO().slice(0, 7);
  let viewMonth = thisMonthKey();
  const monthOf = (it) => (it.date || '').slice(0, 7);
  const inView = (it) => viewMonth === 'all' || monthOf(it) === viewMonth;
  function shiftMonth(key, n) { let [y, m] = key.split('-').map(Number); m += n - 1; y += Math.floor(m / 12); m = ((m % 12) + 12) % 12; return `${y}-${String(m + 1).padStart(2, '0')}`; }
  function setViewMonth(k) { viewMonth = k; render(); }

  /* older entries have no date: file them under today so they stay visible */
  (state.incomes || []).concat(state.expenses || []).forEach(it => { if (!it.date) it.date = todayISO(); });

  /* ── render ── */
  function render() {
    const all = viewMonth === 'all', cur = viewMonth === thisMonthKey();
    const incomes  = (state.incomes  || []).filter(inView);
    const expenses = (state.expenses || []).filter(inView);

    const totalInc = incomes.reduce((s, i) => s + i.amt, 0);
    const totalExp = expenses.reduce((s, e) => s + e.amt, 0);
    const bal      = totalInc - totalExp;

    /* month header + MTD labels */
    let nm, sub, pre;
    if (all) { nm = 'all time'; sub = 'every month together'; pre = 'total'; }
    else { const [y, m] = viewMonth.split('-').map(Number); nm = MONTH_LC[m - 1]; sub = String(y) + (cur ? ' · month to date' : ''); pre = cur ? 'MTD' : MONTH_LC[m - 1].slice(0, 3); }
    document.getElementById('monthName').textContent = nm;
    document.getElementById('monthSub').textContent = sub;
    document.getElementById('lblIncome').textContent = pre + ' income';
    document.getElementById('lblSpent').textContent  = pre + ' spend';
    document.getElementById('lblBal').textContent    = pre + ' balance';
    document.getElementById('wentLabel').textContent = all ? 'where it went · all time' : 'where it went · ' + nm;
    document.getElementById('allTimeBtn').setAttribute('aria-pressed', String(all));
    document.getElementById('thisMonthBtn').setAttribute('aria-pressed', String(cur));
    document.getElementById('prevM').disabled = all; document.getElementById('nextM').disabled = all;

    document.getElementById('statIncome').textContent  = fmt(totalInc);
    document.getElementById('statSpent').textContent   = fmt(totalExp);
    const balEl = document.getElementById('statBalance');
    balEl.textContent = (bal < 0 ? '-' : '') + fmt(bal);
    balEl.className   = 'summary-val ' + (bal >= 0 ? 'pos' : 'neg');

    const emptyMsg = all ? '' : ' in ' + nm;
    /* income list */
    const il = document.getElementById('incomeList');
    il.innerHTML = '';
    if (!incomes.length) {
      il.innerHTML = '<div class="empty-state">no income added yet' + emptyMsg + '…</div>';
    } else {
      incomes.forEach(i => il.appendChild(makeFinanceRow(i, INC_COLORS, true, deleteIncome)));
    }

    /* expense list */
    const el = document.getElementById('expList');
    el.innerHTML = '';
    if (!expenses.length) {
      el.innerHTML = '<div class="empty-state">no expenses yet' + emptyMsg + '…</div>';
    } else {
      expenses.forEach(e => el.appendChild(makeFinanceRow(e, EXP_COLORS, false, deleteExpense)));
    }

    /* where the money went: spending by category */
    const bd = document.getElementById('catBreakdown'); bd.replaceChildren();
    const byCat = {}; expenses.forEach(e => { byCat[e.cat || 'other'] = (byCat[e.cat || 'other'] || 0) + e.amt; });
    const rows = Object.entries(byCat).sort((a, b) => b[1] - a[1]);
    if (!rows.length) { const d = document.createElement('div'); d.className = 'empty-state'; d.textContent = 'log an expense and it will show up here.'; bd.appendChild(d); }
    rows.forEach(([cat, amt]) => {
      const r = document.createElement('div'); r.className = 'brk-row';
      const n = document.createElement('span'); n.textContent = cat;
      const bar = document.createElement('div'); bar.className = 'brk-bar'; const fill = document.createElement('i'); fill.style.width = Math.max(4, Math.round(amt / totalExp * 100)) + '%'; bar.appendChild(fill);
      const v = document.createElement('span'); v.textContent = fmt(amt);
      r.append(n, bar, v); bd.appendChild(r);
    });
    paginate(bd);
    paginate(document.getElementById('expList')); paginate(document.getElementById('incomeList'));
    saveState(state);
  }
  document.getElementById('prevM').addEventListener('click', () => setViewMonth(shiftMonth(viewMonth, -1)));
  document.getElementById('nextM').addEventListener('click', () => setViewMonth(shiftMonth(viewMonth, 1)));
  document.getElementById('thisMonthBtn').addEventListener('click', () => setViewMonth(thisMonthKey()));
  document.getElementById('allTimeBtn').addEventListener('click', () => setViewMonth(viewMonth === 'all' ? thisMonthKey() : 'all'));
  document.getElementById('expDate').value = todayISO(); document.getElementById('incomeDate').value = todayISO();

  /* ── expenses / income view switch ── */
  function showView(which) {
    document.getElementById('viewExp').hidden = which !== 'exp';
    document.getElementById('viewInc').hidden = which !== 'inc';
    document.getElementById('segExp').setAttribute('aria-pressed', String(which === 'exp'));
    document.getElementById('segInc').setAttribute('aria-pressed', String(which === 'inc'));
    render();
  }
  document.getElementById('segExp').addEventListener('click', () => showView('exp'));
  document.getElementById('segInc').addEventListener('click', () => showView('inc'));

  /* ── add income ── */
  function addIncome() {
    const name = document.getElementById('incomeDesc').value.trim();
    const amt  = parseFloat(document.getElementById('incomeAmt').value);
    if (!name || isNaN(amt) || amt <= 0) return;
    state.incomes.unshift({
      id:   state.nextIds.income++,
      name,
      amt,
      type: document.getElementById('incomeType').value,
      date: document.getElementById('incomeDate').value || todayISO(),
    });
    if (viewMonth !== 'all') viewMonth = state.incomes[0].date.slice(0, 7);
    document.getElementById('incomeDesc').value = '';
    document.getElementById('incomeAmt').value  = '';
    render();
  }
  document.getElementById('incomeDesc').addEventListener('keydown', e => { if (e.key === 'Enter') addIncome(); });

  /* ── add expense ── */
  function addExpense() {
    const name = document.getElementById('expDesc').value.trim();
    const amt  = parseFloat(document.getElementById('expAmt').value);
    if (!name || isNaN(amt) || amt <= 0) return;
    state.expenses.unshift({
      id:   state.nextIds.expense++,
      name,
      amt,
      cat:  document.getElementById('expCat').value,
      date: document.getElementById('expDate').value || todayISO(),
    });
    if (viewMonth !== 'all') viewMonth = state.expenses[0].date.slice(0, 7);
    document.getElementById('expDesc').value = '';
    document.getElementById('expAmt').value  = '';
    render();
  }
  document.getElementById('expDesc').addEventListener('keydown', e => { if (e.key === 'Enter') addExpense(); });

  /* ── delete ── */
  function deleteIncome(id)  { state.incomes  = state.incomes.filter(x => x.id !== id);  render(); }
  function deleteExpense(id) { state.expenses = state.expenses.filter(x => x.id !== id); render(); }

  render();
</script>
</body>
</html>
