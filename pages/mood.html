<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>mood · my diary</title>
  <link rel="stylesheet" href="../style.css" />
  <style>

    /* ── mood grid ── */
    .mood-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 8px;
      margin-bottom: 8px;
    }

    .mood-tile {
      border: 0.5px solid var(--border-soft);
      border-radius: 12px;
      padding: 12px 8px 10px;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }
    .mood-tile:hover { transform: translateY(-2px); filter: brightness(0.97); }
    .mood-tile.sel   { outline: 1.5px solid var(--mauve); }

    .mood-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .mood-label-main {
      font-family: var(--font);
      font-size: 14px;
      color: var(--ink);
      line-height: 1.2;
    }

    .mood-label-sub {
      font-size: 13px;
      color: var(--text-muted);
      letter-spacing: 0.04em;
      font-family: var(--font);
    }

    /* ── history log ── */
    .mood-history-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 0.5px solid var(--border-soft);
    }
    .mood-history-dot { width: 30px; height: 30px; flex-shrink: 0; margin-top: 1px; display: flex; }
    .mood-face { display: flex; line-height: 0; }
    .mood-tile { padding: 6px 4px 6px; gap: 2px; }
    .mood-label-sub { font-size: 12px !important; }
    /* monthly summary, pinned to the bottom of the right page */
    .msum { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--border-strong); flex: none; }
    .msum-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .msum-month { font-family: var(--font-script); font-size: 32px; line-height: 1; color: var(--ink); }
    .msum-count { font-size: 13px; color: var(--text-muted); }
    .msum-bar { display: flex; height: 10px; border-radius: 6px; overflow: hidden; margin: 6px 0 8px; background: var(--border-soft); }
    .msum-bar i { display: block; height: 100%; }
    .msum-chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .msum-chip { display: inline-flex; align-items: center; gap: 5px; background: var(--card); border: 1px solid var(--border-soft); border-radius: 16px; padding: 2px 10px 2px 3px; font-size: 13px; color: var(--ink-soft); }
    .msum-chip b { font-weight: 700; color: var(--ink); }
    .mood-history-label {
      font-family: var(--font);
      font-size: 16px;
      color: var(--ink-soft);
    }
    .mood-history-date {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .mood-history-note {
      font-size: 14px;
      color: var(--text-mid);
      margin-top: 4px;
      line-height: 1.6;
    }

    /* ── saved flash ── */
    .saved-flash {
      display: none;
      text-align: center;
      font-family: var(--font);
      font-size: 14px;
      color: var(--mauve);
      letter-spacing: 0.06em;
      margin-top: 10px;
    }

    .journal-box {
      width: 100%;
      min-height: 120px; height: 140px; flex: none;
      border: 0.5px solid var(--border-soft);
      border-radius: 12px;
      background: var(--almond-pale);
      padding: 14px;
      font-size: 16px;
      color: var(--ink-soft);
      font-family: var(--font);
      outline: none;
      resize: none;
      line-height: 1.8;
    }
    .journal-box::placeholder { color: var(--text-muted); }

    /* the imaginary friend takes the whole left page */
    .friend-stage { align-items: center; justify-content: center; text-align: center; gap: 8px; }
    .friend { display: flex; flex-direction: column; align-items: center; gap: 4px; flex: none; }
    .fr-hit { background: none; border: 0; padding: 0; cursor: pointer; width: min(215px, 56%); flex: none; border-radius: 20px; }
    .fr-hit:focus-visible { outline: 3px solid var(--mauve); outline-offset: 3px; }
    .mic-big { font-size: 17px; padding: 10px 26px; min-height: 48px; }
    .ask-btn { margin-top: 0; background: transparent; border: 0; text-decoration: underline; text-underline-offset: 3px; color: var(--mauve-dark); font: 600 14px var(--font); cursor: pointer; min-height: 32px; }
    .mic-big { margin-top: 0; }
    .pg-right .journal-box { min-height: 170px !important; height: 190px !important; }
    .fr-svg { width: 100%; height: auto; display: block; filter: drop-shadow(0 4px 6px rgba(60,25,45,.25)); }
    .fr-body { transform-origin: 100px 139px; animation: frBreathe 5s ease-in-out infinite; }
    .fr-eye { animation: frGlow 3.6s ease-in-out infinite; transform-origin: 113px 72px; }
    .fr-steam { animation: frSteam 3s ease-in-out infinite; }
    .friend.listening .fr-eye { animation-duration: 1s; } .friend.listening .fr-body { animation-duration: 1.6s; }
    .fr-hit:hover .fr-eye { transform: scale(1.25); }
    @keyframes frBreathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.025, 1.015); } }
    @keyframes frGlow { 0%,100% { opacity: .8; transform: scale(1); } 50% { opacity: 1; transform: scale(1.18); } }
    @keyframes frSteam { 0%,100% { opacity: .2; } 50% { opacity: .8; } }
    @media (prefers-reduced-motion: reduce) { .fr-body, .fr-eye, .fr-steam { animation: none; } }
    .fr-side { min-width: 0; }
    .fr-name { font-family: var(--font-caps); text-transform: uppercase; letter-spacing: .14em; font-size: 11px; color: var(--text-muted); }
    .fr-say { margin: 2px 0 6px; font-family: var(--font-script); font-size: 31px; line-height: 1.12; color: var(--ink); max-width: 15em; min-height: 2.3em; }
    .journal-box { min-height: 80px !important; height: 90px !important; }
  </style>
</head>
<body class="mood-page">
<div id="mainApp" class="active fade-open">

  <div class="spine"><div class="spine-text">my diary</div></div>

  <nav class="bookmarks">
    <a class="bm" data-page="today.html"><span class="bm-icon">✦</span>today</a>
    <a class="bm" data-page="tracker.html"><span class="bm-icon">✧</span>makeup</a>
    <a class="bm" data-page="mood.html"><span class="bm-icon">◌</span>friend</a>
    <a class="bm" data-page="finance.html"><span class="bm-icon">◇</span>finance</a>
    <a class="bm" data-page="../index.html"><span class="bm-icon">❀</span>cover</a>
  </nav>

  <main class="page">
    <section class="pg pg-left" aria-label="left page">
      <div class="page-header">
        <div class="page-title">my imaginary friend</div>
        <div class="page-date js-today"></div>
      </div>
      <div class="pg-body friend-stage">
        <div class="friend" id="friend"></div>
        <button class="mic-btn mic-big" id="micBtn" type="button" aria-pressed="false" aria-label="talk to your friend"><span class="mic-icon" aria-hidden="true">🎙</span><span class="mic-label">talk to her</span></button>
        <button class="link-btn ask-btn" id="askBtn" type="button">ask me something else</button>
        <div class="mic-status" id="micStatus" role="status" aria-live="polite"></div>
      </div>
    </section>
    <section class="pg pg-right" aria-label="right page">
      <div class="pg-body">
        <div class="sec-label">what you said</div>
        <textarea class="journal-box" id="journalBox" placeholder="your words land here as you speak. you can also type, or edit them."></textarea>
        <div class="voice-row"><button class="btn-small" id="keepBtn" type="button">keep this talk</button></div>
        <div class="saved-flash" id="savedFlash" role="status">✦ kept in your diary ✦</div>
        <div class="sec-label" style="margin-top:10px" id="talksLabel">our past talks</div>
        <div class="pg-grow" id="moodHistory"></div>
      </div>
    </section>
  </main>
</div>

<script src="../data/diaryData.js"></script>
<script src="../components/expiry.js"></script>
<script src="../components/stickers.js"></script>
<script src="../components/navbar.js"></script>
<script src="../components/pager.js"></script>
<script src="../components/voice.js"></script>
<script src="../components/friend.js"></script>
<script>
  let state = initPage();

  function keepTalk() {
    const box = document.getElementById('journalBox'), note = box.value.trim();
    const flash = document.getElementById('savedFlash');
    if (!note) { flash.textContent = 'say something first, or type it 🌸'; flash.style.display = 'block'; setTimeout(() => { flash.style.display = 'none'; }, 2400); return; }
    state.moods.unshift({ id: state.nextIds.mood++, date: getTodayString(), key: 'talk', label: 'talk', sub: '', note });
    saveState(state);
    box.value = '';
    renderHistory();
    flash.textContent = '✦ kept in your diary ✦'; flash.style.display = 'block';
    setTimeout(() => { flash.style.display = 'none'; }, 2400);
    friend.ask();
  }

  const EYE = '<svg viewBox="0 0 30 30" width="30" height="30" aria-hidden="true"><circle cx="15" cy="15" r="14" fill="#2a1826"/><circle cx="15" cy="15" r="9" fill="rgba(255,235,246,.25)"/><circle cx="15" cy="15" r="3.6" fill="#fff"/></svg>';

  function renderHistory() {
    const wrap = document.getElementById('moodHistory');
    const entries = state.moods || [];
    wrap.replaceChildren();
    if (!entries.length) {
      const d = document.createElement('div'); d.className = 'empty-state'; d.style.padding = '16px 0';
      d.textContent = 'no talks yet. tap her and say something.'; wrap.appendChild(d);
    }
    entries.forEach(e => {
      const row = document.createElement('div'); row.className = 'mood-history-row';
      const dot = document.createElement('div'); dot.className = 'mood-history-dot'; dot.innerHTML = EYE;
      const box = document.createElement('div'); box.style.flex = '1'; box.style.minWidth = '0';
      const date = document.createElement('div'); date.className = 'mood-history-date'; date.textContent = e.date + (e.key !== 'talk' && e.label ? ' · felt ' + e.label : '');
      box.appendChild(date);
      if (e.note) { const n = document.createElement('div'); n.className = 'mood-history-note'; n.textContent = e.note; box.appendChild(n); }
      row.append(dot, box); wrap.appendChild(row);
    });
    renderSummary();
    paginate(wrap);
  }

  /* entry dates look like "Monday, 2 November 2026" */
  function renderSummary() {
    const now = fromISO(todayISO()), mi = now.getMonth(), yr = now.getFullYear();
    let total = 0;
    (state.moods || []).forEach(e => {
      const m = /(\d{1,2})\s+([A-Za-z]+)\s+(\d{4})/.exec(e.date || ''); if (!m) return;
      if (MONTHS.findIndex(n => n.toLowerCase() === m[2].toLowerCase()) === mi && +m[3] === yr) total++;
    });
    document.getElementById('talksLabel').textContent = 'our past talks · ' + total + ' in ' + MONTHS[mi].toLowerCase();
  }

  renderHistory();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(renderHistory);
  const friend = initFriend(document.getElementById('friend'), document.getElementById('micBtn'));
  document.getElementById('askBtn').addEventListener('click', () => friend.ask());
  document.getElementById('keepBtn').addEventListener('click', keepTalk);
  attachVoice({ button: document.getElementById('micBtn'), status: document.getElementById('micStatus'), target: document.getElementById('journalBox'), keyterms: () => [...new Set(['Ploy', state.userName].filter(Boolean))] });
</script>
</body>
</html>
