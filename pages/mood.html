<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>mood · my diary</title>
  <link rel="stylesheet" href="../style.css" />
  <style>

    /* ── mood grid ── */
    .mood-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 8px;
      margin-bottom: 8px;
    }

    .mood-tile {
      border: 0.5px solid var(--border-soft);
      border-radius: 12px;
      padding: 12px 8px 10px;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }
    .mood-tile:hover { transform: translateY(-2px); filter: brightness(0.97); }
    .mood-tile.sel   { outline: 1.5px solid var(--mauve); }

    .mood-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .mood-label-main {
      font-family: var(--font);
      font-size: 14px;
      color: var(--ink);
      line-height: 1.2;
    }

    .mood-label-sub {
      font-size: 13px;
      color: var(--text-muted);
      letter-spacing: 0.04em;
      font-family: var(--font);
    }

    /* ── history log ── */
    .mood-history-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 0.5px solid var(--border-soft);
    }
    .mood-history-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-top: 5px;
      flex-shrink: 0;
    }
    .mood-history-label {
      font-family: var(--font);
      font-size: 16px;
      color: var(--ink-soft);
    }
    .mood-history-date {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .mood-history-note {
      font-size: 14px;
      color: var(--text-mid);
      margin-top: 4px;
      line-height: 1.6;
    }

    /* ── saved flash ── */
    .saved-flash {
      display: none;
      text-align: center;
      font-family: var(--font);
      font-size: 14px;
      color: var(--mauve);
      letter-spacing: 0.06em;
      margin-top: 10px;
    }

    .journal-box {
      width: 100%;
      min-height: 110px;
      border: 0.5px solid var(--border-soft);
      border-radius: 12px;
      background: var(--almond-pale);
      padding: 14px;
      font-size: 16px;
      color: var(--ink-soft);
      font-family: var(--font);
      outline: none;
      resize: none;
      line-height: 1.8;
    }
    .journal-box::placeholder { color: var(--text-muted); }
  </style>
</head>
<body class="mood-page">
<div id="mainApp" class="active fade-open">

  <div class="spine"><div class="spine-text">my diary</div></div>

  <nav class="bookmarks">
    <a class="bm" data-page="today.html"><span class="bm-icon">✦</span>today</a>
    <a class="bm" data-page="tracker.html"><span class="bm-icon">✧</span>makeup</a>
    <a class="bm" data-page="mood.html"><span class="bm-icon">◌</span>mood</a>
    <a class="bm" data-page="finance.html"><span class="bm-icon">◇</span>finance</a>
    <a class="bm" data-page="../index.html"><span class="bm-icon">❀</span>cover</a>
  </nav>

  <main class="page">
    <div class="page-header">
      <div class="page-title">mood of the day</div>
      <div class="page-date js-today"></div>
    </div>
    <div class="page-body">

      <!-- mood selector renders here -->
      <div id="moodSelectorWrap"></div>

      <!-- journal -->
      <div class="sec-label" style="margin-top:20px">dear diary…</div>
      <textarea class="journal-box" id="journalBox" placeholder="write anything your heart wants to say today… or tap speak"></textarea>
      <div class="voice-row">
        <button class="mic-btn" id="micBtn" type="button" aria-pressed="false" aria-label="speak your entry"><span class="mic-icon" aria-hidden="true">🎙</span><span class="mic-label">speak</span></button>
        <span class="mic-status" id="micStatus" role="status" aria-live="polite"></span>
      </div>

      <button class="btn-small" style="margin-top:12px" onclick="saveMood()">save this feeling</button>
      <div class="saved-flash" id="savedFlash">✦ saved to your diary ✦</div>

      <!-- history -->
      <div style="margin-top:28px">
        <div class="sec-label">recent entries</div>
        <div id="moodHistory"></div>
      </div>

    </div>
  </main>
</div>

<script src="../data/diaryData.js"></script>
<script src="../components/moodSelector.js"></script>
<script src="../components/navbar.js"></script>
<script src="../components/voice.js"></script>
<script>
  let state = initPage();
  let selectedMood = null;

  /* init mood selector */
  renderMoodSelector('moodSelectorWrap', null, mood => {
    selectedMood = mood;
  });

  /* save */
  function saveMood() {
    if (!selectedMood) {
      alert('pick a mood first 🌸');
      return;
    }
    const note = document.getElementById('journalBox').value.trim();
    state.moods.unshift({
      id:    state.nextIds.mood++,
      date:  getTodayString(),
      key:   selectedMood.key,
      label: selectedMood.label,
      sub:   selectedMood.sub,
      note,
    });
    saveState(state);
    document.getElementById('journalBox').value = '';
    selectedMood = null;
    renderMoodSelector('moodSelectorWrap', null, mood => { selectedMood = mood; });
    renderHistory();
    const flash = document.getElementById('savedFlash');
    flash.style.display = 'block';
    setTimeout(() => flash.style.display = 'none', 2400);
  }

  /* history */
  const MOOD_DOT_COLORS = {
    soft:'#AA9DA1', light:'#c8a848', alive:'#7aaa70', held:'#c080a8',
    still:'#9a9490', heavy:'#8a7878', restless:'#c09050', blue:'#5880b8',
    tight:'#c06060', toomuch:'#a060a0', alone:'#7070a8', itching:'#50a890', tooaware:'#8858b0',
  };

  function renderHistory() {
    const wrap = document.getElementById('moodHistory');
    const entries = (state.moods || []).slice(0, 10);
    if (!entries.length) {
      wrap.innerHTML = '<div class="empty-state" style="padding:16px 0">no entries yet — check in with yourself today.</div>';
      return;
    }
    wrap.innerHTML = '';
    entries.forEach(e => {
      const row = document.createElement('div');
      row.className = 'mood-history-row';
      row.innerHTML = `
        <div class="mood-history-dot" style="background:${MOOD_DOT_COLORS[e.key] || '#AA9DA1'}"></div>
        <div style="flex:1">
          <div class="mood-history-label">${e.label} <span style="font-size:13px;color:var(--text-muted);font-family:var(--font)">(${e.sub})</span></div>
          <div class="mood-history-date">${e.date}</div>
          ${e.note ? `<div class="mood-history-note">${e.note}</div>` : ''}
        </div>`;
      wrap.appendChild(row);
    });
  }

  renderHistory();

  attachVoice({ button: document.getElementById('micBtn'), status: document.getElementById('micStatus'), target: document.getElementById('journalBox') });
</script>
</body>
</html>
