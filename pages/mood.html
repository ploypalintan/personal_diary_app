<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>mood · my diary</title>
  <link rel="stylesheet" href="../style.css" />
  <style>

    /* ── mood grid ── */
    .mood-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 8px;
      margin-bottom: 8px;
    }

    .mood-tile {
      border: 0.5px solid var(--border-soft);
      border-radius: 12px;
      padding: 12px 8px 10px;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }
    .mood-tile:hover { transform: translateY(-2px); filter: brightness(0.97); }
    .mood-tile.sel   { outline: 1.5px solid var(--mauve); }

    .mood-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .mood-label-main {
      font-family: var(--font);
      font-size: 14px;
      color: var(--ink);
      line-height: 1.2;
    }

    .mood-label-sub {
      font-size: 13px;
      color: var(--text-muted);
      letter-spacing: 0.04em;
      font-family: var(--font);
    }

    /* ── history log ── */
    .mood-history-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 0.5px solid var(--border-soft);
    }
    .mood-history-dot { width: 30px; height: 30px; flex-shrink: 0; margin-top: 1px; display: flex; }
    .mood-face { display: flex; line-height: 0; }
    .mood-tile { padding: 6px 4px 6px; gap: 2px; }
    .mood-label-sub { font-size: 12px !important; }
    /* monthly summary, pinned to the bottom of the right page */
    .msum { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--border-strong); flex: none; }
    .msum-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .msum-month { font-family: var(--font-script); font-size: 32px; line-height: 1; color: var(--ink); }
    .msum-count { font-size: 13px; color: var(--text-muted); }
    .msum-bar { display: flex; height: 10px; border-radius: 6px; overflow: hidden; margin: 6px 0 8px; background: var(--border-soft); }
    .msum-bar i { display: block; height: 100%; }
    .msum-chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .msum-chip { display: inline-flex; align-items: center; gap: 5px; background: var(--card); border: 1px solid var(--border-soft); border-radius: 16px; padding: 2px 10px 2px 3px; font-size: 13px; color: var(--ink-soft); }
    .msum-chip b { font-weight: 700; color: var(--ink); }
    .mood-history-label {
      font-family: var(--font);
      font-size: 16px;
      color: var(--ink-soft);
    }
    .mood-history-date {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .mood-history-note {
      font-size: 14px;
      color: var(--text-mid);
      margin-top: 4px;
      line-height: 1.6;
    }

    /* ── saved flash ── */
    .saved-flash {
      display: none;
      text-align: center;
      font-family: var(--font);
      font-size: 14px;
      color: var(--mauve);
      letter-spacing: 0.06em;
      margin-top: 10px;
    }

    .journal-box {
      width: 100%;
      min-height: 120px; height: 140px; flex: none;
      border: 0.5px solid var(--border-soft);
      border-radius: 12px;
      background: var(--almond-pale);
      padding: 14px;
      font-size: 16px;
      color: var(--ink-soft);
      font-family: var(--font);
      outline: none;
      resize: none;
      line-height: 1.8;
    }
    .journal-box::placeholder { color: var(--text-muted); }

    /* the imaginary friend */
    .friend { display: flex; align-items: center; gap: 12px; flex: none; margin: -2px 0 4px; }
    .fr-hit { background: none; border: 0; padding: 0; cursor: pointer; width: 128px; flex: none; border-radius: 16px; }
    .fr-hit:focus-visible { outline: 3px solid var(--mauve); outline-offset: 3px; }
    .fr-svg { width: 100%; height: auto; display: block; filter: drop-shadow(0 4px 6px rgba(60,25,45,.25)); }
    .fr-body { transform-origin: 100px 139px; animation: frBreathe 5s ease-in-out infinite; }
    .fr-eye { animation: frGlow 3.6s ease-in-out infinite; transform-origin: 113px 72px; }
    .fr-steam { animation: frSteam 3s ease-in-out infinite; }
    .friend.listening .fr-eye { animation-duration: 1s; } .friend.listening .fr-body { animation-duration: 1.6s; }
    .fr-hit:hover .fr-eye { transform: scale(1.25); }
    @keyframes frBreathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.025, 1.015); } }
    @keyframes frGlow { 0%,100% { opacity: .8; transform: scale(1); } 50% { opacity: 1; transform: scale(1.18); } }
    @keyframes frSteam { 0%,100% { opacity: .2; } 50% { opacity: .8; } }
    @media (prefers-reduced-motion: reduce) { .fr-body, .fr-eye, .fr-steam { animation: none; } }
    .fr-side { min-width: 0; }
    .fr-name { font-family: var(--font-caps); text-transform: uppercase; letter-spacing: .14em; font-size: 11px; color: var(--text-muted); }
    .fr-say { margin: 4px 0 0; font-family: var(--font-script); font-size: 26px; line-height: 1.15; color: var(--ink); }
    .journal-box { min-height: 80px !important; height: 90px !important; }
  </style>
</head>
<body class="mood-page">
<div id="mainApp" class="active fade-open">

  <div class="spine"><div class="spine-text">my diary</div></div>

  <nav class="bookmarks">
    <a class="bm" data-page="today.html"><span class="bm-icon">✦</span>today</a>
    <a class="bm" data-page="tracker.html"><span class="bm-icon">✧</span>makeup</a>
    <a class="bm" data-page="mood.html"><span class="bm-icon">◌</span>mood</a>
    <a class="bm" data-page="finance.html"><span class="bm-icon">◇</span>finance</a>
    <a class="bm" data-page="../index.html"><span class="bm-icon">❀</span>cover</a>
  </nav>

  <main class="page">
    <section class="pg pg-left" aria-label="left page">
      <div class="page-header">
        <div class="page-title">mood of the day</div>
        <div class="page-date js-today"></div>
      </div>
      <div class="pg-body">
        <div id="moodSelectorWrap"></div>
      </div>
    </section>
    <section class="pg pg-right" aria-label="right page">
      <div class="pg-body">
        <div class="friend" id="friend"></div>
        <div class="sec-label">dear diary…</div>
        <textarea class="journal-box" id="journalBox" placeholder="write anything your heart wants to say today… or tap speak"></textarea>
        <div class="voice-row">
          <button class="mic-btn" id="micBtn" type="button" aria-pressed="false" aria-label="speak your entry"><span class="mic-icon" aria-hidden="true">🎙</span><span class="mic-label">speak</span></button>
          <button class="btn-small" onclick="saveMood()">save this feeling</button>
        </div>
        <div class="mic-status" id="micStatus" role="status" aria-live="polite"></div>
        <div class="saved-flash" id="savedFlash" role="status">✦ saved to your diary ✦</div>
        <div class="sec-label" style="margin-top:8px">recent entries</div>
        <div class="pg-grow" id="moodHistory"></div>
        <div class="msum" id="moodSummary" aria-label="monthly mood summary"></div>
      </div>
    </section>
  </main>
</div>

<script src="../data/diaryData.js"></script>
<script src="../components/expiry.js"></script>
<script src="../components/moodSelector.js"></script>
<script src="../components/moodFaces.js"></script>
<script src="../components/stickers.js"></script>
<script src="../components/navbar.js"></script>
<script src="../components/pager.js"></script>
<script src="../components/voice.js"></script>
<script src="../components/friend.js"></script>
<script>
  let state = initPage();
  let selectedMood = null;

  /* init mood selector */
  renderMoodSelector('moodSelectorWrap', null, mood => {
    selectedMood = mood;
    if (window.friendEl) window.friendEl.setMood(mood.key);
  });

  /* save */
  function saveMood() {
    if (!selectedMood) {
      const f = document.getElementById('savedFlash'); f.textContent = 'pick a mood on the left page first 🌸'; f.style.display = 'block';
      setTimeout(() => { f.style.display = 'none'; f.textContent = '✦ saved to your diary ✦'; }, 2600);
      return;
    }
    const note = document.getElementById('journalBox').value.trim();
    state.moods.unshift({
      id:    state.nextIds.mood++,
      date:  getTodayString(),
      key:   selectedMood.key,
      label: selectedMood.label,
      sub:   selectedMood.sub,
      note,
    });
    saveState(state);
    document.getElementById('journalBox').value = '';
    selectedMood = null;
    renderMoodSelector('moodSelectorWrap', null, mood => { selectedMood = mood; });
    renderHistory();
    const flash = document.getElementById('savedFlash');
    flash.style.display = 'block';
    setTimeout(() => flash.style.display = 'none', 2400);
  }

  /* history */
  const MOOD_DOT_COLORS = {
    soft:'#AA9DA1', light:'#c8a848', alive:'#7aaa70', held:'#c080a8',
    still:'#9a9490', heavy:'#8a7878', restless:'#c09050', blue:'#5880b8',
    tight:'#c06060', toomuch:'#a060a0', alone:'#7070a8', itching:'#50a890', tooaware:'#8858b0',
  };

  function renderHistory() {
    const wrap = document.getElementById('moodHistory');
    const entries = state.moods || [];
    wrap.replaceChildren();
    if (!entries.length) {
      const d = document.createElement('div'); d.className = 'empty-state'; d.style.padding = '16px 0';
      d.textContent = 'no entries yet — check in with yourself today.'; wrap.appendChild(d);
    }
    entries.forEach(e => {
      const row = document.createElement('div'); row.className = 'mood-history-row';
      const dot = document.createElement('div'); dot.className = 'mood-history-dot'; dot.innerHTML = moodFace(e.key, 30);
      const box = document.createElement('div'); box.style.flex = '1';
      const lab = document.createElement('div'); lab.className = 'mood-history-label'; lab.textContent = e.label + ' ';
      const sub = document.createElement('span'); sub.style.cssText = 'font-size:13px;color:var(--text-muted)'; sub.textContent = `(${e.sub})`; lab.appendChild(sub);
      const date = document.createElement('div'); date.className = 'mood-history-date'; date.textContent = e.date;
      box.append(lab, date);
      if (e.note) { const n = document.createElement('div'); n.className = 'mood-history-note'; n.textContent = e.note; box.appendChild(n); }
      row.append(dot, box); wrap.appendChild(row);
    });
    renderSummary();
    paginate(wrap);
  }

  /* monthly summary: entries dates look like "Monday, 2 November 2026" */
  function renderSummary() {
    const box = document.getElementById('moodSummary'); box.replaceChildren();
    const now = fromISO(todayISO()), mi = now.getMonth(), yr = now.getFullYear();
    const counts = {}; let total = 0;
    (state.moods || []).forEach(e => {
      const m = /(\d{1,2})\s+([A-Za-z]+)\s+(\d{4})/.exec(e.date || ''); if (!m) return;
      if (MONTHS.findIndex(n => n.toLowerCase() === m[2].toLowerCase()) !== mi || +m[3] !== yr) return;
      counts[e.key] = (counts[e.key] || 0) + 1; total++;
    });
    const head = document.createElement('div'); head.className = 'msum-head';
    head.innerHTML = '<span class="msum-month"></span><span class="msum-count"></span>';
    head.firstChild.textContent = MONTHS[mi].toLowerCase() + ' in moods';
    head.lastChild.textContent = total ? total + (total === 1 ? ' check-in' : ' check-ins') : 'no check-ins yet';
    box.appendChild(head);
    if (!total) return;
    const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]);
    const bar = document.createElement('div'); bar.className = 'msum-bar';
    sorted.forEach(([k, n]) => { const i = document.createElement('i'); i.style.width = (n / total * 100) + '%'; i.style.background = MOOD_COLORS[k] ? MOOD_COLORS[k].dot : '#AA9DA1'; bar.appendChild(i); });
    box.appendChild(bar);
    const chips = document.createElement('div'); chips.className = 'msum-chips';
    sorted.slice(0, 6).forEach(([k, n]) => {
      const c = document.createElement('span'); c.className = 'msum-chip';
      const lab = (state.moods.find(e => e.key === k) || {}).label || k;
      c.innerHTML = moodFace(k, 24) + '<span></span><b></b>'; c.children[1].textContent = lab; c.children[2].textContent = '×' + n;
      chips.appendChild(c);
    });
    box.appendChild(chips);
  }

  renderHistory();

  if (document.fonts && document.fonts.ready) document.fonts.ready.then(renderHistory);
  window.friendEl = initFriend(document.getElementById('friend'), document.getElementById('micBtn'), () => selectedMood && selectedMood.key);

  attachVoice({ button: document.getElementById('micBtn'), status: document.getElementById('micStatus'), target: document.getElementById('journalBox') });
</script>
</body>
</html>
