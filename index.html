<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>my diary</title>
  <link rel="stylesheet" href="style.css"/>
  <style>
    body { min-height: 100%; }
    .cover { position: relative; max-width: 760px; margin: 28px auto; padding: 44px 40px 40px 84px; min-height: calc(100vh - 56px);
      background: var(--grain), var(--paper); border-radius: 6px 18px 18px 6px; box-shadow: 0 20px 38px rgba(140,70,90,.20), 0 2px 5px rgba(140,70,90,.14);
      display: none; flex-direction: column; align-items: center; text-align: center; gap: 14px; }
    .cover.active { display: flex; }
    .cover::before { content: ''; position: absolute; top: 24px; bottom: 24px; left: 4px; width: 70px; background: var(--coil) repeat-y 0 0 / 70px 30px; }
    .cover .bow { position: absolute; top: -18px; right: 40px; transform: rotate(8deg); }
    .cover-title { font-family: var(--font-script); font-weight: 400; font-size: clamp(3.2rem, 11vw, 5.4rem); line-height: 1.05; color: var(--ink); text-wrap: balance; }
    .cover .pearls { width: min(320px, 100%); }
    .ns-input { font-family: var(--font); font-size: 1.3rem; color: var(--ink); border: none; border-bottom: 1.5px solid var(--border-strong);
      background: transparent; text-align: center; padding: 8px 16px; outline-offset: 4px; width: min(300px, 100%); }
    .ns-input::placeholder { color: var(--text-muted); }
    .intro { max-width: 340px; color: var(--text-mid); }

    .quote-film { width: min(340px, 100%); margin: 18px 0 8px; --tilt: -1.4deg; padding: 22px 28px 18px; }
    .quote-film .q-text { font-size: 1.06rem; line-height: 1.6; color: var(--ink); }
    .quote-film .q-by { margin-top: 10px; font-family: var(--font-caps); text-transform: uppercase; letter-spacing: .16em; font-size: .82rem; color: var(--text-muted); }
    .doodle[hidden] { display: none; }
    .doodle { position: absolute; left: 25%; top: 415px; width: 90px; height: 70px; opacity: .85; }


    /* ── the cover: dusty-pink linen hardback, lettering pressed into the cloth ── */
    .book { display: none; position: relative; container-type: inline-size; width: min(540px, calc(100% - 24px)); aspect-ratio: 4 / 5; margin: 24px auto; overflow: hidden;
      border-radius: .8cqw 1.6cqw 1.6cqw .8cqw;
      background:
        repeating-linear-gradient(0deg, rgba(255,255,255,.07) 0 1px, rgba(120,60,100,.05) 1px 2px),
        repeating-linear-gradient(90deg, rgba(255,255,255,.06) 0 1px, rgba(120,60,100,.05) 1px 2px),
        var(--grain),
        linear-gradient(160deg, #e1b6cb, #d6a6c0 55%, #cf9db9);
      box-shadow: 0 24px 40px rgba(80,30,60,.34), 0 2px 5px rgba(80,30,60,.25); }
    .book.active { display: flex; flex-direction: column; align-items: center; }
    .book-spine { position: absolute; left: 0; top: 0; bottom: 0; width: 6.5cqw; background: linear-gradient(90deg, #a87592 0, #c391ae 55%, #b48099 80%, rgba(255,255,255,.35) 82%, rgba(255,255,255,.12) 86%, transparent 100%); box-shadow: 1.2cqw 0 2cqw rgba(80,30,60,.22); }
    .cover-head { margin: 15cqw auto 0; align-self: center; width: 80%; text-align: center; }
    .book-top { font-family: var(--font-caps); text-transform: uppercase; letter-spacing: .3em; font-size: 2.6cqw; color: #4a2740; margin-bottom: 2cqw; }
    .book .cover-title { max-width: 4.6em; margin: 0 auto; font-size: 17cqw; line-height: .9; text-wrap: balance; background: linear-gradient(172deg, #fbefbf 0%, #e3bf63 28%, #b68a2c 52%, #f1d98c 70%, #9a7220 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: #b68a2c; filter: drop-shadow(0 .18cqw 0 rgba(255,244,210,.55)) drop-shadow(0 -.15cqw 0 rgba(58,22,44,.6)) drop-shadow(0 .5cqw .7cqw rgba(58,22,44,.35)); }
    .book-line { margin: 4cqw auto 0; max-width: 13em; font-family: var(--font-script); font-size: 5.6cqw; letter-spacing: 0; line-height: 1.2; text-wrap: balance; background: linear-gradient(172deg, #fbefbf 0%, #e3bf63 28%, #b68a2c 52%, #f1d98c 70%, #9a7220 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: #b68a2c; filter: drop-shadow(0 .18cqw 0 rgba(255,244,210,.55)) drop-shadow(0 -.15cqw 0 rgba(58,22,44,.6)) drop-shadow(0 .5cqw .7cqw rgba(58,22,44,.35)); }
    .shelf-line { position: absolute; left: 12cqw; bottom: 3cqw; font-size: 2.8cqw; min-height: 1em; }
    .shoes-btn { position: absolute; left: 50%; bottom: 5cqw; margin-left: -11cqw; width: 22cqw; display: flex; flex-direction: column; align-items: center; background: none; border: 0; cursor: pointer; padding: 0; transform-origin: 50% 0; animation: shoeSway 5.5s ease-in-out infinite; }
    .shoes-btn:hover, .shoes-btn:focus-visible { animation-duration: 2.2s; }
    .shoes-btn:focus-visible { outline: 3px solid #fff; outline-offset: 6px; border-radius: 2cqw; }
    .shoes-ribbon { display: block; width: .5cqw; height: 6cqw; background: linear-gradient(#fff, #f6dbe6); box-shadow: 0 0 .6cqw rgba(80,30,60,.35); }
    .shoes-img { width: 15cqw; height: auto; filter: drop-shadow(0 .7cqw 1cqw rgba(70,25,55,.5)); }
    .shoes-label { margin-top: 1.5cqw; font-family: var(--font-caps); text-transform: uppercase; letter-spacing: .16em; font-size: 2.3cqw; color: #4a2740; background: rgba(255,240,246,.7); padding: .6cqw 2cqw; border-radius: 3cqw; white-space: nowrap; }
    @keyframes shoeSway { 0%,100% { transform: rotate(-2.2deg); } 50% { transform: rotate(2.2deg); } }
    @media (prefers-reduced-motion: reduce) { .shoes-btn { animation: none; } }
    .book .edit-name-btn { position: absolute; right: 4cqw; top: 3cqw; background: rgba(255,240,246,.7); border-radius: 3cqw; padding: .6cqw 2.4cqw; color: #4a2740; font-size: 2.6cqw; min-height: 0; }
    .cover-seal { position: absolute; right: 5cqw; bottom: 5cqw; width: 14cqw; height: auto; transform: rotate(-10deg); filter: drop-shadow(0 .6cqw 1cqw rgba(70,25,55,.45)); z-index: 2; pointer-events: none; }
    .cover-fly { position: absolute; height: auto; z-index: 2; pointer-events: none; filter: drop-shadow(0 .5cqw .8cqw rgba(70,25,55,.35)); transform-origin: 50% 60%; animation: flutter 4.8s ease-in-out infinite; }
    .cover-fly.f2 { right: 7cqw; top: 40cqw; width: 12cqw; --r: 14deg; }
    @keyframes flutter { 0%,100% { transform: rotate(var(--r)) scale(1); } 50% { transform: rotate(calc(var(--r) + 6deg)) scale(.93, 1.03); } }
    @media (prefers-reduced-motion: reduce) { .cover-fly { animation: none; transform: rotate(var(--r)); } }
    @media (max-width: 520px) { .book { aspect-ratio: 5 / 7.6; } .cover-head { margin-top: 18cqw; } }
    @media (max-width: 400px) { .book-line { font-size: 20px; } .shoes-label { font-size: 9px; } .book .edit-name-btn { font-size: 10px; } }
    .shelf { display: inline-block; color: var(--mauve-dark); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
    .edit-name-btn { background: none; border: none; cursor: pointer; color: var(--text-muted); font: 500 .9rem var(--font); text-decoration: underline; min-height: 36px; padding: 0 8px; }
    .edit-name-btn:hover { color: var(--mauve-dark); }
    @media (max-width: 640px) {
      .cover { margin: 11px; padding: 36px 20px 30px 52px; min-height: calc(100vh - 22px); }
      .cover::before { left: -10px; width: 50px; background-size: 50px 21px; }
      .doodle { display: none; }
    }

    /* ── the curtains open onto a French bedroom; we walk toward the window, then the diary opens ── */
    .scene { position: fixed; inset: 0; z-index: 1000; display: none; overflow: hidden; opacity: 0; cursor: pointer; background: #f6e9e6; }
    .scene.play { display: block; animation: sceneIn .45s ease forwards; }
    .scene.leave { animation: sceneOut .7s ease forwards; }
    @keyframes sceneIn { to { opacity: 1; } }
    @keyframes sceneOut { from { opacity: 1; } to { opacity: 0; } }
    .scene-frame { position: absolute; top: 0; bottom: 0; left: 50%; width: min(100%, calc(100vh * .72)); transform: translateX(-50%); overflow: hidden; box-shadow: 0 0 40px rgba(90,40,60,.3); background: #fbefe9; }
    .scene-view { position: absolute; inset: 0; }
    .scene-view svg { width: 100%; height: 100%; display: block; }
    .scene .bgL, .scene .fgL { transform-box: view-box; }
    .scene .bgL { transform-origin: 72% 46%; }
    .scene .fgL { transform-origin: 62% 100%; }
    .scene.play .bgL { animation: walkBg 4.4s cubic-bezier(.45,0,.35,1) .9s forwards; }
    .scene.play .fgL { animation: walkFg 4.4s cubic-bezier(.45,0,.35,1) .9s forwards; }
    @keyframes walkBg { to { transform: scale(1.38); } }
    @keyframes walkFg { to { transform: scale(1.7) translateY(70px); opacity: .0; } }
    .scene .fgL { opacity: 1; }
    .twinkle { animation: twinkle 1.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes twinkle { 0%,100% { opacity: .35; } 50% { opacity: 1; filter: drop-shadow(0 0 2px #fff); } }
    .flame { animation: flick 1.4s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
    @keyframes flick { 0%,100% { transform: scaleY(1); } 50% { transform: scaleY(1.18); } }
    .chand { transform-box: view-box; transform-origin: 30% 0; animation: swing 6s ease-in-out infinite; }
    @keyframes swing { 0%,100% { transform: rotate(-.7deg); } 50% { transform: rotate(.7deg); } }
    .sway { transform-box: fill-box; transform-origin: 50% 0; animation: sway 5s ease-in-out infinite; }
    .sway.b { animation-delay: -2.2s; }
    @keyframes sway { 0%,100% { transform: skewX(-1.2deg); } 50% { transform: skewX(1.4deg); } }
    .rays { animation: rays 6s ease-in-out infinite; }
    @keyframes rays { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
    .cloudW { animation: drift 26s linear infinite; } .cloudW.b { animation-duration: 38s; animation-delay: -14s; }
    @keyframes drift { from { transform: translateX(-60px); } to { transform: translateX(170px); } }
    .bird { animation: fly 8s linear infinite; } .bird.b { animation-duration: 11s; animation-delay: -4s; }
    @keyframes fly { from { transform: translate(210px, 0); } to { transform: translate(400px, -24px); } }

    /* the entrance curtains: very light baby pink, sheer and quiet */
    .curtain { position: absolute; top: 0; bottom: 0; width: 51%; z-index: 3;
      background: repeating-linear-gradient(90deg, rgba(255,255,255,.55) 0 5px, rgba(214,150,170,.10) 10px 20px, rgba(255,255,255,.4) 26px 31px),
                  linear-gradient(180deg, #fdf3f6, #f8e3ea 75%, #f4d9e1);
      box-shadow: 0 0 26px rgba(150,90,110,.16); }
    .curtain.l { left: 0; transform-origin: 0 50%; border-right: 1px solid rgba(255,255,255,.9); }
    .curtain.r { right: 0; transform-origin: 100% 50%; border-left: 1px solid rgba(255,255,255,.9); }
    .scene.play .curtain { animation: part 2.3s cubic-bezier(.66,0,.3,1) .5s forwards; }
    @keyframes part { to { transform: scaleX(.16); } }
    .rod { position: absolute; top: 0; left: 0; right: 0; height: 14px; z-index: 4; background: linear-gradient(#f4e2b0, #c79c4a 55%, #e9d08e); box-shadow: 0 2px 4px rgba(120,80,40,.3); }
    .rod::before, .rod::after { content: ''; position: absolute; top: -2px; width: 18px; height: 18px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff3c4, #c79c4a 70%); }
    .rod::before { left: -4px; } .rod::after { right: -4px; }
    .tie { position: absolute; top: 56%; width: 46px; height: 46px; z-index: 5; opacity: 0; }
    .tie.l { left: 1%; } .tie.r { right: 1%; transform: scaleX(-1); }
    .scene.play .tie { animation: tieIn .6s ease 2.2s forwards; }
    @keyframes tieIn { to { opacity: 1; } }
    .skip { position: absolute; left: 50%; bottom: max(18px, env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 6; padding: 6px 16px; border-radius: 16px; background: rgba(255,248,246,.85); color: var(--ink); font: 500 .85rem var(--font); }
    @media (prefers-reduced-motion: reduce) { .scene { display: none !important; } }

      border-radius: .8cqw 1.6cqw 1.6cqw .8cqw;
      background:
        repeating-linear-gradient(0deg, rgba(255,255,255,.07) 0 1px, rgba(120,60,100,.05) 1px 2px),
        repeating-linear-gradient(90deg, rgba(255,255,255,.06) 0 1px, rgba(120,60,100,.05) 1px 2px),
        var(--grain),
        linear-gradient(160deg, #e1b6cb, #d6a6c0 55%, #cf9db9);
      box-shadow: 0 24px 40px rgba(80,30,60,.34), 0 2px 5px rgba(80,30,60,.25); }
    .book.active { display: flex; flex-direction: column; align-items: center; }
    .book-spine { position: absolute; left: 0; top: 0; bottom: 0; width: 6.5cqw; background: linear-gradient(90deg, #a87592 0, #c391ae 55%, #b48099 80%, rgba(255,255,255,.35) 82%, rgba(255,255,255,.12) 86%, transparent 100%); box-shadow: 1.2cqw 0 2cqw rgba(80,30,60,.22); }

    .shoes-img { width: 15cqw; height: auto; filter: drop-shadow(0 .7cqw 1cqw rgba(70,25,55,.5)); }

    @keyframes shoeSway { 0%,100% { transform: rotate(-2.2deg); } 50% { transform: rotate(2.2deg); } }

<body>

  <!-- name screen -->
  <main id="nameScreen" class="cover active">
    <div class="lace-band r" aria-hidden="true"></div>
    <div class="bow" aria-hidden="true"></div>
    <div class="t-eyebrow">a little digital journal</div>
    <h1 class="cover-title">hello, you</h1>
    <div class="pearls" aria-hidden="true"></div>
    <p class="t-body intro">what shall we call you? this diary belongs entirely to you.</p>
    <label for="nameInput" class="t-eyebrow">your name</label>
    <input class="ns-input" id="nameInput" placeholder="your name…" maxlength="32" autocomplete="off"/>
    <button class="btn-primary" id="beginBtn" type="button">begin my diary</button>
  </main>

  <!-- cover: dusty-pink cloth hardback; the hanging ballet shoes are the "open" button -->
  <main id="splashScreen" class="book">
    <div class="book-spine" aria-hidden="true"></div>
    <div class="cover-head">
      <div class="book-top">my journal</div>
      <h1 class="cover-title" id="splashTitle"></h1>
      <p class="book-line" id="quoteText"></p>
    </div>
    <img class="sticker cover-fly f2" src="assets/stickers/butterfly-4.png" alt="" aria-hidden="true" width="279" height="284"/>
    <p class="t-body shelf-line" id="shelfLine" role="status"></p>
    <button class="shoes-btn" id="openBtn" type="button">
      <img class="shoes-img" src="assets/ballet-shoes-hang.png" alt="" width="172" height="420"/>
      <span class="shoes-label">open today's diary</span>
    </button>
    <img class="sticker cover-seal" src="assets/stickers/wax-cupid.png" alt="" aria-hidden="true" width="360" height="360"/>
    <button class="edit-name-btn" id="editName" type="button">change my name</button>
  </main>

  <!-- opening scene: curtains part onto a window; decorative, tap to skip -->
  <div class="scene" id="scene" aria-hidden="true">
    <div class="scene-frame"><div class="scene-view">
      <svg viewBox="0 0 400 600" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false">
<defs><pattern id="floral" width="64" height="64" patternUnits="userSpaceOnUse">
<rect width="64" height="64" fill="#fbefe9"/>

<script src="components/expiry.js"></script>
<script>
  let state = loadState();
  const $ = (id) => document.getElementById(id);

  function show(id) {
    ['nameScreen', 'splashScreen'].forEach(s => $(s).classList.toggle('active', s === id));
    const h = $(id).querySelector('h1'); if (h) h.setAttribute('tabindex', '-1');
  }
  function paintCover() {
    $('splashTitle').textContent = state.userName.toLowerCase() + "'s diary";
    $('quoteText').textContent = 'she is pure poetry, walking & breathing';

    /* a live line about the makeup shelf, linking to the tracker */
    const line = $('shelfLine');
    const list = (state.products || []).filter(p => !p.finished);
    if (!list.length) { line.textContent = ''; return; }
    const today = todayISO();
    const soon = list.filter(p => { const k = productStatus(p, today).kind; return k === 'soon' || k === 'expired'; }).length;
    const a = document.createElement('a');
    a.className = 'shelf'; a.href = 'pages/tracker.html';
    a.textContent = `${list.length} product${list.length > 1 ? 's' : ''} on your shelf` + (soon ? ` · ${soon} need${soon > 1 ? '' : 's'} attention` : '');
    line.replaceChildren(a);
  }
  function saveName() {
    const v = $('nameInput').value.trim();
    if (!v) { $('nameInput').focus(); return; }
    state.userName = v; saveState(state);
    paintCover(); show('splashScreen');
  }

  $('beginBtn').addEventListener('click', saveName);
  $('nameInput').addEventListener('keydown', e => { if (e.key === 'Enter') saveName(); });
  let opening = false;
  function goToday() { window.location.href = 'pages/today.html'; }
  $('openBtn').addEventListener('click', () => {
    if (opening) return;
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) { goToday(); return; }
    opening = true;
    const sc = $('scene'); sc.classList.add('play');
    const t1 = setTimeout(() => sc.classList.add('leave'), 4800);
    const t2 = setTimeout(goToday, 5450);
    const skip = () => { clearTimeout(t1); clearTimeout(t2); goToday(); };
    sc.addEventListener('click', skip);
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') skip(); });
  });
  $('editName').addEventListener('click', () => { $('nameInput').value = state.userName; show('nameScreen'); $('nameInput').focus(); });

  if (state.userName) { paintCover(); show('splashScreen'); } else show('nameScreen');
</script>
