<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>my diary</title>
  <link rel="stylesheet" href="style.css"/>
  <style>
    body { min-height: 100%; }
    .cover { position: relative; max-width: 760px; margin: 28px auto; padding: 44px 40px 40px 84px; min-height: calc(100vh - 56px);
      background: var(--grain), var(--paper); border-radius: 6px 18px 18px 6px; box-shadow: 0 20px 38px rgba(140,70,90,.20), 0 2px 5px rgba(140,70,90,.14);
      display: none; flex-direction: column; align-items: center; text-align: center; gap: 14px; }
    .cover.active { display: flex; }
    .cover::before { content: ''; position: absolute; top: 24px; bottom: 24px; left: 4px; width: 70px; background: var(--coil) repeat-y 0 0 / 70px 30px; }
    .cover .bow { position: absolute; top: -18px; right: 40px; transform: rotate(8deg); }
    .cover-title { font-family: var(--font-script); font-weight: 400; font-size: clamp(3.2rem, 11vw, 5.4rem); line-height: 1.05; color: var(--ink); text-wrap: balance; }
    .cover .pearls { width: min(320px, 100%); }
    .ns-input { font-family: var(--font); font-size: 1.3rem; color: var(--ink); border: none; border-bottom: 1.5px solid var(--border-strong);
      background: transparent; text-align: center; padding: 8px 16px; outline-offset: 4px; width: min(300px, 100%); }
    .ns-input::placeholder { color: var(--text-muted); }
    .intro { max-width: 340px; color: var(--text-mid); }

    .quote-film { width: min(340px, 100%); margin: 18px 0 8px; --tilt: -1.4deg; padding: 22px 28px 18px; }
    .quote-film .q-text { font-size: 1.06rem; line-height: 1.6; color: var(--ink); }
    .quote-film .q-by { margin-top: 10px; font-family: var(--font-caps); text-transform: uppercase; letter-spacing: .16em; font-size: .82rem; color: var(--text-muted); }
    .doodle[hidden] { display: none; }
    .doodle { position: absolute; left: 25%; top: 415px; width: 90px; height: 70px; opacity: .85; }


    /* ── the planner cover (photo) ── */
    .book { display: none; position: relative; container-type: inline-size; width: min(540px, calc(100% - 24px)); aspect-ratio: 736 / 1055; margin: 24px auto;
      background: url("assets/planner-cover.jpg") center / 100% 100% no-repeat; border-radius: 4cqw; box-shadow: 0 22px 40px rgba(90,40,60,.32); }
    .book.active { display: block; }
    .book-content { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; text-align: center; padding: 12% 22% 0 9%; gap: 1.6cqw; }
    .book .cover-title { font-size: 15cqw; line-height: 1.02; }
    .book .pearls { width: 60%; margin: 1cqw 0; }
    .book-line { font-size: 5.2cqw; line-height: 1.55; color: var(--ink); max-width: 15em; text-wrap: balance; }
    .book .t-body { font-size: 3.4cqw; }
    .book .btn-primary { margin-top: auto; font-size: 3.8cqw; padding: 2.2cqw 6cqw; }
    .book .edit-name-btn { margin-bottom: 11%; color: var(--ink-soft); font-size: 3.4cqw; }
    @media (max-width: 400px) { .book .btn-primary { font-size: 14px; padding: 9px 22px; } .book .edit-name-btn, .book .t-body { font-size: 13px; } .book-line { font-size: 17px; } }
    .shelf { display: inline-block; color: var(--mauve-dark); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
    .edit-name-btn { background: none; border: none; cursor: pointer; color: var(--text-muted); font: 500 .9rem var(--font); text-decoration: underline; min-height: 36px; padding: 0 8px; }
    .edit-name-btn:hover { color: var(--mauve-dark); }
    @media (max-width: 640px) {
      .cover { margin: 11px; padding: 36px 20px 30px 52px; min-height: calc(100vh - 22px); }
      .cover::before { left: -10px; width: 50px; background-size: 50px 21px; }
      .doodle { display: none; }
    }

    /* ── the curtains open onto a little Paris window, then the diary opens ── */
    .scene { position: fixed; inset: 0; z-index: 1000; display: none; overflow: hidden; background: #f3d6dd; opacity: 0; cursor: pointer; }
    .scene.play { display: block; animation: sceneIn .45s ease forwards; }
    .scene.leave { animation: sceneOut .6s ease forwards; }
    @keyframes sceneIn { to { opacity: 1; } }
    @keyframes sceneOut { from { opacity: 1; } to { opacity: 0; } }
    .scene-view { position: absolute; inset: 0; transform-origin: 50% 60%; }
    .scene.play .scene-view { animation: dolly 4.4s ease-out forwards; }
    @keyframes dolly { from { transform: scale(1); } to { transform: scale(1.07); } }
    .scene { background: var(--desk) url(assets/ballet-bg.jpg) center / cover; }
    .scene-frame { position: absolute; top: 0; bottom: 0; left: 50%; width: min(100%, calc(100vh * .7)); transform: translateX(-50%); overflow: hidden; box-shadow: 0 0 40px rgba(90,40,60,.35); }
    .scene-view svg { width: 100%; height: 100%; display: block; }
    .scene .tie { width: 56px; height: 56px; }
    .cloud { animation: drift 38s linear infinite; }
    .cloud.b { animation-duration: 55s; animation-delay: -20s; }
    @keyframes drift { from { transform: translateX(-90px); } to { transform: translateX(480px); } }
    .bird { animation: fly 9s linear infinite; }
    .bird.b { animation-duration: 12s; animation-delay: -5s; }
    @keyframes fly { from { transform: translate(-40px, 0); } 50% { transform: translate(200px, -16px); } to { transform: translate(450px, 4px); } }
    .twinkle { animation: twinkle 1.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .twinkle:nth-of-type(2n) { animation-delay: -.5s; } .twinkle:nth-of-type(3n) { animation-delay: -1.1s; }
    @keyframes twinkle { 0%,100% { opacity: .15; transform: scale(.6); } 50% { opacity: 1; transform: scale(1.2); } }
    .tree { animation: sway 5s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
    @keyframes sway { 0%,100% { transform: rotate(-.8deg); } 50% { transform: rotate(.8deg); } }

    .curtain { position: absolute; top: 0; bottom: 0; width: 51%; z-index: 3;
      background: repeating-linear-gradient(90deg, rgba(255,255,255,.30) 0 7px, rgba(160,70,100,.13) 14px 24px, rgba(255,255,255,.22) 30px 36px),
                  linear-gradient(180deg, #f6c4d1, #f0a9bc 70%, #e993ab);
      box-shadow: 0 0 30px rgba(110,40,70,.25); }
    .curtain.l { left: 0; transform-origin: 0 50%; border-right: 2px solid rgba(255,255,255,.5); }
    .curtain.r { right: 0; transform-origin: 100% 50%; border-left: 2px solid rgba(255,255,255,.5); }
    .scene.play .curtain { animation: part 2.1s cubic-bezier(.66,0,.3,1) .55s forwards; }
    @keyframes part { to { transform: scaleX(.2); } }
    .rod { position: absolute; top: 0; left: 0; right: 0; height: 26px; z-index: 4; background: linear-gradient(#fbe7ec, #e7a9bb); border-bottom: 2px solid rgba(120,50,80,.35);
      -webkit-mask: radial-gradient(circle 9px at 9px 100%, transparent 98%, #000) 0 0 / 18px 100%; mask: radial-gradient(circle 9px at 9px 100%, transparent 98%, #000) 0 0 / 18px 100%; }
    .tie { position: absolute; top: 56%; width: 56px; height: 56px; z-index: 5; opacity: 0; }
    .tie.l { left: 1%; } .tie.r { right: 1%; transform: scaleX(-1); }
    .scene.play .tie { animation: tieIn .6s ease 2.1s forwards; }
    @keyframes tieIn { to { opacity: 1; } }
    .skip { position: absolute; left: 50%; bottom: max(18px, env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 6; padding: 6px 16px; border-radius: 16px; background: rgba(255,248,246,.85); color: var(--ink); font: 500 .85rem var(--font); }
    @media (prefers-reduced-motion: reduce) { .scene { display: none !important; } }
  </style>
</head>
<body>

  <!-- name screen -->
  <main id="nameScreen" class="cover active">
    <div class="lace-band r" aria-hidden="true"></div>
    <div class="bow" aria-hidden="true"></div>
    <div class="t-eyebrow">a little digital journal</div>
    <h1 class="cover-title">hello, you</h1>
    <div class="pearls" aria-hidden="true"></div>
    <p class="t-body intro">what shall we call you? this diary belongs entirely to you.</p>
    <label for="nameInput" class="t-eyebrow">your name</label>
    <input class="ns-input" id="nameInput" placeholder="your name…" maxlength="32" autocomplete="off"/>
    <button class="btn-primary" id="beginBtn" type="button">begin my diary</button>
  </main>

  <!-- cover: the planner -->
  <main id="splashScreen" class="book">
    <div class="book-content">
      <div class="t-eyebrow">my journal</div>
      <h1 class="cover-title" id="splashTitle"></h1>
      <div class="pearls" aria-hidden="true"></div>
      <p class="book-line" id="quoteText"></p>
      <p class="t-body" id="shelfLine" role="status"></p>
      <button class="btn-primary" id="openBtn" type="button">open today's diary</button>
      <button class="edit-name-btn" id="editName" type="button">change my name</button>
    </div>
  </main>

  <!-- opening scene: curtains part onto a window; decorative, tap to skip -->
  <div class="scene" id="scene" aria-hidden="true">
    <div class="scene-frame"><div class="scene-view">
      <svg viewBox="0 0 400 600" preserveAspectRatio="xMidYMid slice">
        <defs>
          <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cdd6ea"/><stop offset=".55" stop-color="#f4d4de"/><stop offset="1" stop-color="#fbe6dc"/></linearGradient>
          <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff6e6" stop-opacity=".95"/><stop offset="1" stop-color="#fff6e6" stop-opacity="0"/></radialGradient>
        </defs>
        <rect width="400" height="600" fill="url(#sky)"/>
        <circle cx="300" cy="150" r="90" fill="url(#glow)"/>
        <g class="cloud" fill="#fff" opacity=".8"><ellipse cx="60" cy="110" rx="34" ry="10"/><ellipse cx="82" cy="102" rx="22" ry="9"/></g>
        <g class="cloud b" fill="#fff" opacity=".65"><ellipse cx="200" cy="190" rx="40" ry="11"/><ellipse cx="226" cy="182" rx="24" ry="9"/></g>
        <!-- the tower -->
        <g fill="#8c7683" stroke="#8c7683" stroke-linejoin="round">
          <path d="M112 480 L136 372 L150 305 L160 235 L168 165 L172 120 L176 165 L184 235 L194 305 L208 372 L232 480 L214 480 L198 410 Q172 388 146 410 L130 480 Z"/>
          <path d="M171 120 L172 82 L173 120" stroke-width="2" fill="none"/>
          <rect x="143" y="302" width="58" height="6" rx="1"/><rect x="157" y="232" width="30" height="5" rx="1"/><rect x="133" y="370" width="78" height="7" rx="1"/>
        </g>
        <g stroke="#b7a2ad" stroke-width="1" fill="none"><path d="M152 308 L192 370 M192 308 L152 370 M162 238 L182 300 M182 238 L162 300"/></g>
        <g fill="#fff3cf"><path class="twinkle" d="M172 76 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2z"/><path class="twinkle" d="M150 300 l1.5 4 4 1.5 -4 1.5 -1.5 4 -1.5 -4 -4 -1.5 4 -1.5z"/><path class="twinkle" d="M196 232 l1.5 4 4 1.5 -4 1.5 -1.5 4 -1.5 -4 -4 -1.5 4 -1.5z"/><path class="twinkle" d="M214 368 l1.5 4 4 1.5 -4 1.5 -1.5 4 -1.5 -4 -4 -1.5 4 -1.5z"/></g>
        <!-- the building -->
        <path d="M258 262 L276 232 H344 L362 262 Z" fill="#8c7683"/>
        <rect x="262" y="262" width="96" height="220" fill="#e4cdd3"/>
        <rect x="258" y="262" width="104" height="6" fill="#c9afb8"/>
        <g fill="#a98d99"><rect x="272" y="280" width="14" height="26" rx="6"/><rect x="298" y="280" width="14" height="26" rx="6"/><rect x="324" y="280" width="14" height="26" rx="6"/>
          <rect x="272" y="326" width="14" height="26" rx="6"/><rect x="298" y="326" width="14" height="26" rx="6"/><rect x="324" y="326" width="14" height="26" rx="6"/>
          <rect x="272" y="372" width="14" height="26" rx="6"/><rect x="298" y="372" width="14" height="26" rx="6"/><rect x="324" y="372" width="14" height="26" rx="6"/></g>
        <g fill="#fff0c8" opacity=".85"><rect class="twinkle" x="300" y="328" width="10" height="20" rx="5"/><rect class="twinkle" x="326" y="374" width="10" height="20" rx="5"/></g>
        <!-- trees -->
        <g fill="#a8bea4"><ellipse class="tree" cx="60" cy="470" rx="62" ry="46"/><ellipse class="tree" cx="360" cy="478" rx="70" ry="40"/><ellipse class="tree" cx="230" cy="490" rx="64" ry="34" fill="#b7ccb2"/></g>
        <!-- birds -->
        <g fill="none" stroke="#6f5a66" stroke-width="1.6" stroke-linecap="round"><path class="bird" d="M0 70 q5 -6 10 0 q5 -6 10 0"/><path class="bird b" d="M0 120 q4 -5 8 0 q4 -5 8 0"/></g>
        <!-- window frame -->
        <g fill="none" stroke="#9a6c5c" stroke-linecap="round"><rect x="4" y="4" width="392" height="590" stroke-width="12"/><path d="M200 4 V590" stroke-width="12"/></g>
        <g fill="#f3e2d0" stroke="#9a6c5c"><circle cx="186" cy="320" r="5"/><circle cx="214" cy="320" r="5"/></g>
        <!-- balcony railing -->
        <rect x="0" y="540" width="400" height="60" fill="#e9c7cf"/>
        <g fill="none" stroke="#4f3b44" stroke-width="3" stroke-linecap="round">
          <path d="M0 484 H400 M0 540 H400" stroke-width="4"/>
          <path d="M0 484 V540 M40 484 V540 M80 484 V540 M120 484 V540 M160 484 V540 M200 484 V540 M240 484 V540 M280 484 V540 M320 484 V540 M360 484 V540 M400 484 V540" stroke-width="2.2"/>
          <g stroke-width="2.4"><circle cx="20" cy="512" r="11"/><circle cx="60" cy="512" r="11"/><circle cx="100" cy="512" r="11"/><circle cx="140" cy="512" r="11"/><circle cx="180" cy="512" r="11"/><circle cx="220" cy="512" r="11"/><circle cx="260" cy="512" r="11"/><circle cx="300" cy="512" r="11"/><circle cx="340" cy="512" r="11"/><circle cx="380" cy="512" r="11"/></g>
        </g>
      </svg>
    </div>
    <div class="curtain l"></div><div class="curtain r"></div>
    <div class="rod"></div>
    <svg class="tie l" viewBox="0 0 56 56"><path d="M28 28 C12 14 4 22 8 30 C4 40 18 40 28 28 C38 40 52 40 48 30 C52 22 44 14 28 28Z" fill="#ffffff" stroke="#b35878" stroke-width="2"/><circle cx="28" cy="28" r="5" fill="#e0869d" stroke="#b35878" stroke-width="1.5"/></svg>
    <svg class="tie r" viewBox="0 0 56 56"><path d="M28 28 C12 14 4 22 8 30 C4 40 18 40 28 28 C38 40 52 40 48 30 C52 22 44 14 28 28Z" fill="#ffffff" stroke="#b35878" stroke-width="2"/><circle cx="28" cy="28" r="5" fill="#e0869d" stroke="#b35878" stroke-width="1.5"/></svg>
    </div><div class="skip">tap to skip</div>
  </div>

<script src="data/diaryData.js"></script>
<script src="components/expiry.js"></script>
<script>
  let state = loadState();
  const $ = (id) => document.getElementById(id);

  function show(id) {
    ['nameScreen', 'splashScreen'].forEach(s => $(s).classList.toggle('active', s === id));
    const h = $(id).querySelector('h1'); if (h) h.setAttribute('tabindex', '-1');
  }
  function paintCover() {
    $('splashTitle').textContent = state.userName.toLowerCase() + "'s diary";
    $('quoteText').textContent = 'she is pure poetry, walking & breathing';

    /* a live line about the makeup shelf, linking to the tracker */
    const line = $('shelfLine');
    const list = (state.products || []).filter(p => !p.finished);
    if (!list.length) { line.textContent = ''; return; }
    const today = todayISO();
    const soon = list.filter(p => { const k = productStatus(p, today).kind; return k === 'soon' || k === 'expired'; }).length;
    const a = document.createElement('a');
    a.className = 'shelf'; a.href = 'pages/tracker.html';
    a.textContent = `${list.length} product${list.length > 1 ? 's' : ''} on your shelf` + (soon ? ` · ${soon} need${soon > 1 ? '' : 's'} attention` : '');
    line.replaceChildren(a);
  }
  function saveName() {
    const v = $('nameInput').value.trim();
    if (!v) { $('nameInput').focus(); return; }
    state.userName = v; saveState(state);
    paintCover(); show('splashScreen');
  }

  $('beginBtn').addEventListener('click', saveName);
  $('nameInput').addEventListener('keydown', e => { if (e.key === 'Enter') saveName(); });
  let opening = false;
  function goToday() { window.location.href = 'pages/today.html'; }
  $('openBtn').addEventListener('click', () => {
    if (opening) return;
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) { goToday(); return; }
    opening = true;
    const sc = $('scene'); sc.classList.add('play');
    const t1 = setTimeout(() => sc.classList.add('leave'), 3700);
    const t2 = setTimeout(goToday, 4250);
    const skip = () => { clearTimeout(t1); clearTimeout(t2); goToday(); };
    sc.addEventListener('click', skip);
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') skip(); });
  });
  $('editName').addEventListener('click', () => { $('nameInput').value = state.userName; show('nameScreen'); $('nameInput').focus(); });

  if (state.userName) { paintCover(); show('splashScreen'); } else show('nameScreen');
</script>
</body>
</html>
